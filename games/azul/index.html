function modal(html){$('modal-content').innerHTML=html;$('modal').classList.remove('hide')}function close(){$('modal').classList.add('hide')}$('modal').addEventListener('click',e=>{if(e.target===$('modal')&&s?.timeoutPending)return;if(e.target===$('modal'))close()});document.addEventListener('click',e=>{if(e.target.closest('[data-start-tutorial]')){close();startTutorial();return}if(e.target.closest('[data-tutorial-exit]')){restoreTutorial();return}if(e.target.closest('[data-azul-back]'))parent.postMessage({type:'azul:back'},location.origin);if(e.target.closest('[data-close]'))close();if(e.target.closest('[data-end-game]')){modal(`<h2>پایان بازی</h2><p>می‌خواهی بازی آزول را همین حالا تمام کنی؟${online?' پایان برای همهٔ بازیکنان ثبت می‌شود.':''}</p><button class="cta" data-end-confirm>بله، اتمام بازی</button><button class="cta secondary" data-close>ادامهٔ بازی</button>`);return}if(e.target.closest('[data-end-confirm]')){close();if(online&&onlineRole==='guest'){parent.postMessage({type:'azul:end-request'},location.origin);toast('درخواست پایان بازی برای میزبان فرستاده شد')}else if(s&&!s.over){clearTimeout(timer);s.over=true;s.ended=true;s.endReason='manual';s.turn=-1;s.last='بازی توسط بازیکن پایان یافت';render();result()}return}let b=e.target.closest('[data-new]');if(b){if(online){toast('بازی آنلاین را فقط میزبان می‌تواند دوباره آغاز کند');return}close();setup(Number(b.dataset.new)||((s&&s.n)||4))}let r=e.target.closest('[data-resume]');if(r){if(online)return;close();s=savedCandidate;savedCandidate=null;chosen=s.pending||null;timeoutHandled=false;render();if(s.over)setTimeout(result,200);else if((online?onlineRole==='host'&&onlineAi[s.turn]:s.turn!==0))timer=setTimeout(botMove,azulAiThinkDelay())}});
$('azul-back').onclick=()=>parent.postMessage({type:'azul:back'},'*');clockInterval=setInterval(()=>{updateClock();if(!tutorialMode&&s&&!s.over&&!s.timeoutPending&&!timeoutHandled&&(!online||onlineRole==='host')&&Date.now()>=(s.turnDeadline||0))timerExpired()},500);
document.addEventListener('click',e=>{const d=e.target.closest('[data-difficulty]');if(!d)return;aiDifficulty=Number(d.dataset.difficulty)||0;try{localStorage.setItem('mahbang-azul-difficulty',String(aiDifficulty))}catch(_){}close();toast('سختی رایانه ذخیره شد')});
$('settings').onclick=()=>modal(`<h2>تنظیمات بازی</h2>${online?'':'<p>درجهٔ سختی رایانه</p><button class="cta" data-difficulty="0">آسان</button><button class="cta" data-difficulty="1">متوسط</button><button class="cta" data-difficulty="2">سخت</button>'}<button class="cta secondary" data-end-game>اتمام بازی</button><button class="cta secondary" data-close>بستن</button>`);
$('mode').onclick=()=>modal(online?`<h2>بازی آنلاین</h2><p>تعداد بازیکنان این اتاق ${fa(s.n)} نفر است و در این بازی تغییر نمی‌کند.</p><button class="cta secondary" data-close>بستن</button>`:`<h2>تعداد بازیکنان</h2><p>بازی در این نسخه با رایانه اجرا می‌شود. برای دیدن چیدمان چهار نفره، ۴ نفر را انتخاب کن.</p><button class="cta" data-new="2">۲ نفر</button><button class="cta" data-new="3">۳ نفر</button><button class="cta" data-new="4">۴ نفر</button><button class="cta secondary" data-close>بستن</button>`);
$('restart').onclick=()=>modal(online?`<h2>بازی آنلاین</h2><p>برای آغاز دوباره، میزبان باید بازی تازه‌ای ایجاد کند.</p><button class="cta secondary" data-close>بستن</button>`:`<h2>بازی تازه؟</h2><p>وضعیت فعلی ذخیره شده است؛ با شروع مجدد جایگزین می‌شود.</p><button class="cta" data-new="${s.n}">شروع مجدد</button><button class="cta secondary" data-close>بازگشت</button>`);
$('help').onclick=()=>modal(`<h2>راهنمای آزول مهبانگ</h2><p><strong>برداشت کاشی:</strong> از یک کارگاه یا مرکز میز یک رنگ را انتخاب کن. اگر از کارگاه برداری، کاشی‌های رنگ‌های دیگر به مرکز می‌روند؛ از مرکز که برداری، نشان آغازگر هم به کف جریمه می‌آید.</p><p><strong>چیدمان:</strong> کاشی‌ها را در ردیف‌های پلکانی سمت چپ بگذار. قانون مهبانگ اجازه می‌دهد کاشی‌های هم‌رنگ یک برداشت را بین چند ردیف مجاز تقسیم کنی. کاشی‌های واقعاً اضافه به کف جریمه می‌روند.</p><p><strong>دیوار و امتیاز:</strong> در پایان دور، ردیف‌های کامل به دیوار ۵×۵ منتقل می‌شوند و امتیاز کاشی‌های مجاور حساب می‌شود. تکمیل ردیف، ستون یا یک رنگ هم امتیاز پایانی دارد.</p><p><strong>نوبت و زمان:</strong> هر نوبت ۶۰ ثانیه است. اگر بازیکن کاری نکند، رایانه به‌جایش کاشی برمی‌دارد و می‌چیند.</p><p>در بازی آموزشی، یک دور تمرینی را انجام می‌دهی: اول برداشت دو کاشی را بین دو ردیف تقسیم می‌کنی، بعد حرکت هر حریف و نتیجهٔ امتیازدهی را جداگانه می‌بینی. بازی ذخیره‌شده‌ات دست‌نخورده می‌ماند.</p>${online?'<p><strong>قطع اتصال:</strong> در بازی آنلاین، اگر مهمان در بازی دونفره قطع شود، میزبان ۷۵ ثانیه برای بازگشتش صبر می‌کند؛ در بازی ۳ یا ۴ نفره رایانه جایش را می‌گیرد. اتصال قطع‌شده تا ۳ دقیقه برای وصل مجدد تلاش می‌کند.</p>':'<button class="cta" data-start-tutorial>بازی آموزشی</button>'}<button class="cta secondary" data-close>بستن راهنما</button>`);
function reportStats(p){
  const colors=Array.from({length:5},(_,c)=>p.wall.every(row=>row.includes(c))).filter(Boolean).length;
  const rows=p.wall.filter(row=>row.every(v=>v!==null)).length;
  const columns=Array.from({length:5},(_,c)=>p.wall.every(row=>row[c]!==null)).filter(Boolean).length;
  return {colors,rows,columns};
}
function makeReport(){
  const names=s.players.map(p=>String(p.name||'بازیکن'));
  const stats=s.players.map(reportStats),rows=[
    {l:'تکمیل رنگ',v:stats.map(x=>x.colors)},
    {l:'تکمیل سطر',v:stats.map(x=>x.rows)},
    {l:'تکمیل ستون',v:stats.map(x=>x.columns)}
  ];
  (s.roundHistory||[]).forEach(h=>rows.push({l:'امتیاز دست '+fa(h.round),v:s.players.map((_,i)=>Number(h.scores&&h.scores[i])||0)}));
  rows.push({l:'امتیاز نهایی',v:s.players.map(p=>p.score),h:1});
  return {v:1,id:'azul',gid:s.gameId||'az-'+Date.now(),g:'آزول',t:Date.now(),dur:elapsedMs(),n:s.n,names,ai:s.players.map((_,i)=>online?!!onlineAi[i]:i>0),res:(()=>{const high=Math.max(...s.players.map(p=>p.score)),w=s.players.map((p,i)=>p.score===high?i:-1).filter(i=>i>=0);return w.length>1?'draw':w[0]})(),rows,sum:['پاداش پایان بازی: هر رنگ ۱۰، هر سطر ۲، هر ستون ۷'],rn:s.round};
}
function reportTable(rp){
  const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  return `<h3>گزارش امتیاز</h3><p class="report-note">تکمیل رنگ، سطر و ستون به‌صورت تعداد؛ امتیاز هر دست شامل امتیاز کاشی‌ها و پاداش‌های همان دست است.</p><div class="azul-report-scroll"><table class="azul-report"><thead><tr><th>نوع امتیاز</th>${rp.names.map(n=>`<th>${esc(n)}</th>`).join('')}</tr></thead><tbody>${rp.rows.map(r=>`<tr><th>${esc(r.l)}</th>${r.v.map(v=>`<td>${fa(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="report-note">${rp.sum.map(esc).join(' · ')}</p>`;
}
function result(){
  if(!s.over||resultShown)return;
  resultShown=true;
  const best=Math.max(...s.players.map(p=>p.score));
  const winners=s.players.map((p,i)=>p.score===best?(i===(online?onlineSeat:0)?'شما':(p.name||'بازیکن')):null).filter(Boolean);
  const rp=makeReport();
  if(!online)parent.postMessage({type:'azul:report',report:rp},location.origin);
  modal(`<h2>پایان بازی</h2><p>${s.endReason==='timer'?'زمان بازی به پایان رسید.':s.endReason==='host-lost'?'اتصال به میزبان برقرار نشد؛ بازی پایان یافت.':s.endReason==='guest-lost'?'مهمان در مهلت تعیین‌شده برنگشت؛ بازی پایان یافت.':s.ended?'این بازی به درخواست بازیکن پایان یافت.':'برنده: <b>'+winners.join(' و ')+'</b>'}</p>${s.players.map((p,i)=>`<p>${i===(online?onlineSeat:0)?'شما':(p.name||'بازیکن '+fa(i))}: <b>${fa(p.score)}</b> امتیاز</p>`).join('')}${reportTable(rp)}<button class="cta" data-azul-back>بازگشت به هاب</button>`);
}
function startScreen(){modal(`<h2>آزول مهبانگ</h2><p>تعداد بازیکنان را انتخاب کن؛ یک نفر انسانی و بقیه رایانه‌ای بازی می‌کنند.</p><button class="cta" data-new="2">شروع بازی · ۲ نفر</button><button class="cta" data-new="3">شروع بازی · ۳ نفر</button><button class="cta" data-new="4">شروع بازی · ۴ نفر</button>${savedCandidate?'<button class="cta secondary" data-resume>ادامهٔ بازی ذخیره‌شده</button>':''}<button class="cta secondary" data-azul-back>بازگشت به هاب</button>`);}
window.addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin||!e.data)return;const d=e.data;const safe=v=>typeof v==='string'&&v.indexOf('data:image/')===0?v:null;
if(d.type==='azul:set-avatars'){avatarProfile=safe(d.profile);avatarOpponents=Array.isArray(d.opponents)?d.opponents.map(safe):[];const targets=s?s.players:(savedCandidate?savedCandidate.players:null);if(targets){targets.forEach((p,i)=>{const image=i===0?avatarProfile:avatarOpponents[i-1];if(image)p.avatar=image});if(s)render()}parent.postMessage({type:'azul:avatars-ready'},location.origin);return}
if(d.type==='azul:online-init'){online=true;onlineRole=d.role==='host'?'host':'guest';onlineSeat=Math.max(0,Math.min((d.n|0)-1,d.seat|0));onlineAi=Array.isArray(d.ai)?d.ai.map(Boolean):Array.from({length:d.n|0},(_,i)=>i>0);suppressPublish=true;clearTimeout(timer);
if(d.state&&d.state.n===d.n){s=JSON.parse(JSON.stringify(d.state));if(!s.gameId)s.gameId='az-'+Date.now()+'-'+rnd(1000000);if(!Array.isArray(s.roundHistory))s.roundHistory=[];chosen=s.pending||null}else if(onlineRole==='host'){setup(Math.max(2,Math.min(4,d.n|0)));}
if(s){s.timeoutPending=false;s.turnDeadline=Number(s.turnDeadline)||Date.now()+60000;timeoutHandled=false;s.n=d.n|0;s.players.forEach((p,i)=>{p.name=String((d.names||[])[i]||p.name||'بازیکن');if(Array.isArray(d.avatars)&&safe(d.avatars[i]))p.avatar=d.avatars[i]});s.turn=s.turn<0?-1:s.turn;resultShown=false;suppressPublish=false;render();if(s.over)result();else if(onlineRole==='host'&&onlineAi[s.turn])timer=setTimeout(botMove,azulAiThinkDelay())}return}
if(d.type==='azul:room-state'&&online&&onlineRole==='guest'&&d.state&&d.state.n>=2&&d.state.n<=4){s=JSON.parse(JSON.stringify(d.state));s.turnDeadline=Number(s.turnDeadline)||Date.now()+60000;s.timeoutPending=false;if(!Array.isArray(s.roundHistory))s.roundHistory=[];timeoutHandled=false;onlineSeat=Math.max(0,Math.min(s.n-1,d.seat|0));chosen=s.pending||null;onlineAi=Array.isArray(d.ai)?d.ai.map(Boolean):onlineAi;suppressPublish=true;render();suppressPublish=false;if(s.over)result();return}
if(d.type==='azul:connection'&&online){if(d.state==='reconnecting'&&onlineRole==='guest'){connectionState='reconnecting';render();return}if(d.state==='connected'){connectionState='';connectionUntil=0;render();toast('ارتباط بازی برقرار شد');return}if(d.state==='guest-wait'&&onlineRole==='host'){connectionState='guest-wait';connectionUntil=Number(d.until)||0;render();return}if(d.state==='guest-forfeit'&&onlineRole==='host'&&s&&!s.over){close();connectionState='';s.over=true;s.endReason='guest-lost';s.turn=-1;s.last='مهمان در مهلت تعیین‌شده برنگشت';render();result();return}if(d.state==='lost'&&onlineRole==='guest'&&s&&!s.over){close();connectionState='';s.over=true;s.endReason='host-lost';s.turn=-1;s.last='اتصال به میزبان برقرار نشد';render();result();return}}
if(d.type==='azul:seat-update'&&online&&onlineRole==='host'){const previous=onlineAi.slice();if(Array.isArray(d.ai))onlineAi=d.ai.map(Boolean);if(Array.isArray(d.names)&&s)d.names.forEach((n,i)=>{if(s.players[i])s.players[i].name=String(n||'بازیکن')});render();if(previous.some((v,i)=>!v&&onlineAi[i]))toast('رایانه موقتاً جای مهمان را گرفت');if(previous.some((v,i)=>v&&!onlineAi[i]))toast('مهمان به بازی برگشت');if(!s.over&&onlineAi[s.turn])timer=setTimeout(botMove,azulAiThinkDelay());return}
if(d.type==='azul:remote-action'&&online&&onlineRole==='host'){if(d.seat===s?.turn&&d.action)applyAction(d.seat,d.action);return}
if(d.type==='azul:end-request'&&online&&onlineRole==='host'&&s&&!s.over){clearTimeout(timer);s.over=true;s.ended=true;s.endReason='manual';s.turn=-1;s.last='بازی توسط بازیکن پایان یافت';render();result()}
});
if(!online){if(load()){savedCandidate=s;s=null;if(params.get('resume')==='1')startScreen();else if(params.get('autostart')==='1')setup(Math.max(2,Math.min(4,Number(params.get('players')||2))));else startScreen()}else if(params.get('autostart')==='1'){setup(Math.max(2,Math.min(4,Number(params.get('players')||2))))}else{startScreen()}}
})();
