</style>
</head><body>
<main class="app" id="app"><header class="header"><div class="brand"><div class="brand-mark">❖</div><div><strong>آزول <span style="color:#a37b3e">| مهبانگ</span></strong><small>AZUL • MAHBANG</small></div></div><div class="actions"><button id="azul-back" class="icon-btn image-back" aria-label="بازگشت به هاب"></button><button class="icon-btn gear-btn" id="settings" aria-label="تنظیمات">⚙</button><span id="round" class="pill">دور ۱</span><time id="timer" class="pill" aria-label="زمان بازی">۰۰:۰۰</time><button class="pill" id="mode" aria-label="تعداد بازیکنان">۴ نفر ▾</button><button class="icon-btn image-help" id="help" aria-label="راهنما"></button><button class="icon-btn image-menu" id="restart" aria-label="شروع دوباره"></button></div></header>
<section id="opponents" class="opponents" aria-label="صفحه حریفان"></section>
<section class="play-area"><div class="section-heading"><span>◈ کارخانه‌های کاشی</span><small id="bag">کیسه: ۰</small></div><div class="table-layout"><div id="factories" class="factories"></div><div class="center-row"><span class="center-name">مرکز میز</span><div id="center" class="center"></div></div></div><div class="reserve-row" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div></section>
<section class="player-area"><div class="board-wash" aria-hidden="true"><i></i><i></i><i></i></div><div class="player-head"><span class="player-avatar-wrap"><img id="my-avatar" class="player-avatar" src="assets/avatar_sara.webp" alt="آواتار شما"></span><strong id="my-name">صفحه شما</strong><div class="player-score"><span id="my-score">۰</span><small>امتیاز</small></div></div><div class="board-main"><div id="patterns" class="pattern-side"></div><div class="wall-divider"></div><div id="wall" class="wall-side"></div></div><div id="floor" class="floor"></div><div class="foot-actions"><span id="instruction" class="instruction">برای شروع، یک رنگ انتخاب کن</span><button id="put-floor" disabled>🔥 سوزاندن</button></div></section>
<footer class="status"><span id="status">نوبت شماست</span><span id="message">کاشی‌های دلخواه را انتخاب کن</span></footer></main>
<div class="toast" id="toast"></div><div class="modal hide" id="modal"><div class="modal-card" id="modal-content"></div></div>
<script>
(()=>{'use strict';
const COLORS=['آبی','قرمز','زرد','فیروزه‌ای','مشکی'], HEX=['#2065a9','#c53e55','#dba632','#29a3a6','#1e2d43'], SYMBOLS=['✦','✿','◆','❖','✧'], PEN=[1,1,2,2,2,3,3], KEY='mahbang-azul-light-v4';
let s=null,chosen=null,timer=null,toastTimer=null;const params=new URLSearchParams(location.search);let aiDifficulty=Math.max(0,Math.min(2,Number(localStorage.getItem('mahbang-azul-difficulty')||params.get('difficulty')||1)));let clockInterval=null;let cpuAvatars=[];try{cpuAvatars=JSON.parse(params.get('cpuAvatars')||'[]')}catch(e){}
const $=x=>document.getElementById(x),fa=x=>Number(x).toLocaleString('fa-IR'),faDigits=x=>String(x).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[Number(d)]),rnd=n=>Math.floor(Math.random()*n);
const tile=(c,extra='',props='')=>`<button type="button" class="tile ${extra}" data-c="${c}" data-symbol="${SYMBOLS[c]}" aria-label="${COLORS[c]}" ${props}></button>`;document.querySelector('.play-area').appendChild($('put-floor'));
const board=()=>({lines:[[],[],[],[],[]],wall:Array.from({length:5},()=>Array(5).fill(null)),floor:[],score:0,name:'',avatar:''});
const AVATARS=['avatar_sara.webp','avatar_maryam.webp','avatar_ali.webp','avatar_sara.webp'];const DEFAULT_NAMES=['','مریم','علی','سارا'];let savedCandidate=null;
function avatarSrc(value,seat){if(typeof value==='string'&&value.indexOf('data:image/')===0)return value;let ix=Number(value);if(Number.isInteger(ix)&&ix>=0&&ix<10){try{if(parent&&typeof parent.avUrl==='function')return parent.avUrl(ix)}catch(e){}}if(typeof value==='string'&&/^avatar_[a-z0-9_-]+\.webp$/i.test(value))return 'assets/'+value;return 'assets/'+AVATARS[(seat||0)%AVATARS.length]}
if(params.get('fresh')==='1')localStorage.removeItem(KEY);
const wallColor=(r,c)=>(r+c)%5;const tileAsset=c=>['blue','red','yellow','turquoise','black'][c];
const legal=(p,c,r)=>p.lines[r].length<r+1&&(p.lines[r].length===0||p.lines[r][0]===c)&&!p.wall[r].includes(c);
const opts=(p,c)=>[0,1,2,3,4].filter(r=>legal(p,c,r));
function save(){try{if(s){s.elapsed=(s.elapsed||0)+Math.max(0,Date.now()-(s.startedAt||Date.now()));s.startedAt=Date.now();localStorage.setItem(KEY,JSON.stringify(s))}}catch(e){}}
function updateClock(){if(!s)return;const elapsed=Math.floor(((s.elapsed||0)+Math.max(0,Date.now()-(s.startedAt||Date.now())))/1000),secs=Math.max(0,150-elapsed),m=String(Math.floor(secs/60)).padStart(2,'0'),q=String(secs%60).padStart(2,'0');$('timer').textContent='⌛ '+m+':'+q}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.n>=2&&x.n<=4&&x.players.length===x.n){x.elapsed=Math.max(0,Number(x.elapsed)||0);x.startedAt=Date.now();let mine=params.get('avatar')||'0';x.players.forEach((p,i)=>{if(i===0)p.avatar=mine;else if(cpuAvatars[i-1])p.avatar=cpuAvatars[i-1];else if(typeof p.avatar==='string'&&p.avatar.indexOf('avatar_')===0)p.avatar=String(i%10)});s=x;chosen=s.pending||null;return true}}catch(e){}return false}
function setup(n){clearTimeout(timer);let bag=[];for(let c=0;c<5;c++)for(let j=0;j<20;j++)bag.push(c);let mine=params.get('avatar')||'0';s={n,players:Array.from({length:n},(_,i)=>Object.assign(board(),{name:i===0?(params.get('player')||'شما'):DEFAULT_NAMES[(i-1)%3+1],avatar:i===0?mine:(cpuAvatars[i-1]||String(i%10))})),bag,discard:[],factories:[],center:[],round:1,elapsed:0,startedAt:Date.now(),starter:0,nextStarter:null,turn:0,firstToken:true,over:false,last:'',pending:null};chosen=null;refill();render();toast('بازی '+fa(n)+' نفره شروع شد')}
function draw(){if(!s.bag.length&&s.discard.length)s.bag=s.discard.splice(0);if(!s.bag.length)return null;return s.bag.splice(rnd(s.bag.length),1)[0]}
function refill(){const count=2*s.n+1;s.factories=Array.from({length:count},()=>{let a=[];for(let i=0;i<4;i++){let v=draw();if(v!==null)a.push(v)}return a});s.center=[];s.firstToken=true;s.turn=s.starter;s.last='دور جدید آغاز شد';s.pending=null;chosen=null}
function groups(){let g=[];s.factories.forEach((a,i)=>{[...new Set(a)].forEach(c=>g.push({source:'f',index:i,color:c,count:a.filter(x=>x===c).length}))});[...new Set(s.center)].forEach(c=>g.push({source:'c',index:-1,color:c,count:s.center.filter(x=>x===c).length}));return g}
function begin(g,seat){let a=g.source==='f'?s.factories[g.index]:s.center;let taken=a.filter(x=>x===g.color);if(!taken.length)return false;g.started=true;g.count=taken.length;g.remaining=taken.length;if(g.source==='f'){s.center.push(...a.filter(x=>x!==g.color));s.factories[g.index]=[]}else{s.center=s.center.filter(x=>x!==g.color);if(s.firstToken){s.firstToken=false;s.nextStarter=seat;s.players[seat].floor.push('first')}}return true}
function take(g,seat,row){let p=s.players[seat];if(row!==-1&&!legal(p,g.color,row))return false;if(!g.started&&!begin(g,seat))return false;if(row===-1){p.floor.push(...Array(g.remaining).fill(g.color));g.remaining=0}else{let n=Math.min(g.remaining,row+1-p.lines[row].length);p.lines[row].push(...Array(n).fill(g.color));g.remaining-=n}if(g.remaining>0&&!opts(p,g.color).length){p.floor.push(...Array(g.remaining).fill(g.color));toast('باقی‌مانده بدون جای مجاز به کف رفت');g.remaining=0}if(g.remaining===0){s.pending=null;chosen=null;s.last=(seat===0?'شما':'رایانه '+fa(seat))+' '+fa(g.count)+' کاشی برداشت';advance()}else{s.pending=g;chosen=g;render();toast(fa(g.remaining)+' کاشی باقی مانده؛ ردیف بعدی را انتخاب کن')}return true}
function advance(){if(groups().length===0){finishRound();return}s.turn=(s.turn+1)%s.n;render();if(s.turn!==0)timer=setTimeout(botMove,440)}
function neighbors(w,r,c,dr,dc){let n=0;for(let i=r+dr,j=c+dc;i>=0&&i<5&&j>=0&&j<5&&w[i][j]!==null;i+=dr,j+=dc)n++;return n}
function wallPoints(w,r,c){let h=1+neighbors(w,r,c,0,1)+neighbors(w,r,c,0,-1),v=1+neighbors(w,r,c,1,0)+neighbors(w,r,c,-1,0);return(h>1?h:0)+(v>1?v:0)+(h===1&&v===1?1:0)}
function bonus(p){let n=0;for(let i=0;i<5;i++){if(p.wall[i].every(v=>v!==null))n+=2;if(p.wall.every(r=>r[i]!==null))n+=7}for(let c=0;c<5;c++)if(p.wall.every(row=>row.includes(c)))n+=10;return n}
function finishRound(){let logs=[];for(let p of s.players){let gain=0;for(let r=0;r<5;r++){let a=p.lines[r];if(a.length!==r+1)continue;let c=a[0],col=(c-r+5)%5;p.wall[r][col]=c;gain+=wallPoints(p.wall,r,col);s.discard.push(...a.slice(1));p.lines[r]=[]}const penalty=p.floor.slice(0,7).reduce((sum,_,i)=>sum+PEN[i],0);s.discard.push(...p.floor.filter(Number.isInteger));p.floor=[];p.score=Math.max(0,p.score+gain-penalty);logs.push('+'+gain+' / −'+penalty)}s.last='پایان دور '+fa(s.round)+' | شما '+logs[0];if(s.players.some(p=>p.wall.some(r=>r.every(x=>x!==null)))){s.players.forEach(p=>p.score+=bonus(p));s.over=true;s.turn=-1;render();setTimeout(result,550);return}if(s.nextStarter!==null)s.starter=s.nextStarter;s.nextStarter=null;s.round++;refill();render();toast('دور '+fa(s.round)+' شروع شد');if(s.turn!==0)timer=setTimeout(botMove,450)}
function botMove(){if(s.over||s.turn===0)return;let all=groups(),p=s.players[s.turn];if(!all.length){finishRound();return}let ranked=[];for(let g of all){for(let row of opts(p,g.color)){let used=Math.min(g.count,row+1-p.lines[row].length),waste=g.count-used,complete=p.lines[row].length+used===row+1?5:0;ranked.push({g,row,score:used*1.4+complete-waste*(aiDifficulty===0?1.2:2)+Math.random()*(aiDifficulty===0?2.8:aiDifficulty===1?.55:.08)})}ranked.push({g,row:-1,score:-g.count*(aiDifficulty===0?2:3)+Math.random()*(aiDifficulty===0?2.8:aiDifficulty===1?.55:.08)})}ranked.sort((a,b)=>b.score-a.score);let g={...ranked[0].g};begin(g,s.turn);let row=ranked[0].row;if(row===-1){p.floor.push(...Array(g.remaining).fill(g.color));g.remaining=0}else{let amount=Math.min(g.remaining,row+1-p.lines[row].length);p.lines[row].push(...Array(amount).fill(g.color));g.remaining-=amount;while(g.remaining>0&&opts(p,g.color).length){let r=opts(p,g.color).sort((a,b)=>(a+1-p.lines[a].length)-(b+1-p.lines[b].length))[0];let k=Math.min(g.remaining,r+1-p.lines[r].length);p.lines[r].push(...Array(k).fill(g.color));g.remaining-=k}if(g.remaining>0)p.floor.push(...Array(g.remaining).fill(g.color))}s.last='رایانه '+fa(s.turn)+' '+fa(g.count)+' کاشی '+COLORS[g.color]+' برداشت';advance()}
function colorStyle(c){return ['#c5e1f5','#f4c8d0','#f7e4ad','#bcece6','#b8c2d2'][c]}
function render(){if(!s)return;$('round').textContent='دور '+fa(s.round);updateClock();$('mode').textContent=fa(s.n)+' نفر ▾';$('bag').textContent='کیسه: '+fa(s.bag.length);$('my-score').textContent=String(s.players[0].score);$('my-name').textContent=s.players[0].name||'شما';$('my-avatar').src=avatarSrc(s.players[0].avatar,0);$('status').textContent=s.over?'بازی تمام شد':s.turn===0?'● نوبت شماست':'رایانه '+fa(s.turn)+' در حال بازی…';$('message').textContent=s.last||'یک رنگ را انتخاب کن';
const opponentCount=s.n-1,opponents=$('opponents');opponents.dataset.count=opponentCount;opponents.style.gridTemplateColumns=`repeat(${opponentCount},minmax(0,1fr))`;
opponents.innerHTML=s.players.slice(1).map((p,j)=>{let seat=j+1;return `<div class="opponent ${s.turn===seat?'active':''}"><div class="opp-head"><span class="opp-avatar-wrap"><img class="opp-avatar" src="${avatarSrc(p.avatar,seat)}" alt=""></span><span class="opp-name">${p.name||'رایانه '+fa(seat)}</span><span class="opp-score">${p.score}</span></div><div class="opp-preview"><div class="opp-lines">${p.lines.map((a,r)=>`<div class="mini-line">${Array.from({length:r+1},(_,j)=>`<span class="mini-slot" style="${j>=r+1-a.length&&a.length?'background-image:url(assets/tile-'+['blue','red','yellow','turquoise','black'][a[0]]+'.webp);background-size:contain;background-repeat:no-repeat;background-position:center':''}"></span>`).join('')}</div>`).join('')}</div><div class="opp-wall">${p.wall.flat().map((c,j)=>`<span class="mini-cell ${c!==null?'placed':''}" style="${c!==null?'background-image:url(assets/tile-'+tileAsset(c)+'.webp);background-size:contain;background-repeat:no-repeat;background-position:center':'--ghost-img:url(assets/tile-'+tileAsset(wallColor(Math.floor(j/5),j%5))+'.webp)'}"></span>`).join('')}</div></div></div>`}).join('');
const selectionActive=!!chosen&&!chosen.started;const isSel=(src,idx,c)=>selectionActive&&chosen.source===src&&chosen.index===idx&&chosen.color===c;
$('factories').className='factories count-'+s.factories.length;$('factories').innerHTML=s.factories.map((a,i)=>`<div class="factory ${a.length?'':'empty'}">${a.map(c=>tile(c,(isSel('f',i,c)?'selected':'')+(selectionActive&&!isSel('f',i,c)?' faded':''),`data-source="f" data-i="${i}" ${s.turn!==0||s.over||chosen?.started?'disabled':''}`)).join('')}<span class="fnum">${i+1}</span></div>`).join('')+Array.from({length:9-s.factories.length},()=>'<div></div>').join('');
$('center').innerHTML=(s.firstToken?'<span class="first-token">۱</span>':'')+s.center.map(c=>tile(c,(isSel('c',-1,c)?'selected':'')+(selectionActive&&!isSel('c',-1,c)?' faded':''),`data-source="c" data-i="-1" ${s.turn!==0||s.over||chosen?.started?'disabled':''}`)).join('');
let p=s.players[0];$('patterns').innerHTML=p.lines.map((a,r)=>`<div class="pattern-row ${chosen&&legal(p,chosen.color,r)?'available':''}" data-row="${r}" aria-label="ردیف ${r+1}">${Array.from({length:r+1},(_,j)=>`<div class="slot">${j>=r+1-a.length&&a.length?tile(a[0],'static','disabled'):''}</div>`).join('')}</div>`).join('');
$('wall').innerHTML=p.wall.map((row,r)=>row.map((c,i)=>`<div class="wall-cell ${c===null?'empty':''}" style="--ghost:${colorStyle(wallColor(r,i))};--ghost-img:url(assets/tile-${tileAsset(wallColor(r,i))}.webp)">${c!==null?tile(c,'static','disabled'):''}</div>`).join('')).join('');
$('floor').innerHTML='<span class="floor-label">کف</span>'+Array.from({length:7},(_,i)=>`<span class="floor-item"><span class="slot">${p.floor[i]===undefined?'':p.floor[i]==='first'?'<span class="first-token">۱</span>':tile(p.floor[i],'static','disabled')}</span><small>−${PEN[i]}</small></span>`).join('');
$('put-floor').disabled=!chosen||s.turn!==0;$('instruction').textContent=chosen?(chosen.started?'باقی‌مانده: '+fa(chosen.remaining)+' کاشی — یک ردیف دیگر را لمس کن':'انتخاب: '+fa(chosen.count)+' '+COLORS[chosen.color]+' — ردیف مقصد را لمس کن'):'یک رنگ از کارخانه یا مرکز لمس کن';save()}
function toast(t){let e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.remove('show'),2200)}
function select(e){let b=e.target.closest('[data-source]');if(!b||s.turn!==0||s.over||chosen?.started)return;let g=groups().find(x=>x.source===b.dataset.source&&x.index===Number(b.dataset.i)&&x.color===Number(b.dataset.c));if(!g)return;if(chosen&&chosen.source===g.source&&chosen.index===g.index&&chosen.color===g.color){chosen=null}else chosen={...g};render()}
$('factories').addEventListener('click',select);$('center').addEventListener('click',select);
$('patterns').addEventListener('click',e=>{let r=e.target.closest('[data-row]');if(!r||!chosen||s.turn!==0)return;if(!take(chosen,0,Number(r.dataset.row)))toast('این ردیف برای رنگ انتخابی مجاز نیست')});
$('put-floor').onclick=()=>{if(chosen)take(chosen,0,-1)};
function modal(html){$('modal-content').innerHTML=html;$('modal').classList.remove('hide')}function close(){$('modal').classList.add('hide')}$('modal').addEventListener('click',e=>{if(e.target===$('modal'))close()});document.addEventListener('click',e=>{if(e.target.closest('[data-azul-back]'))parent.postMessage({type:'azul:back'},'*');if(e.target.closest('[data-close]'))close();let b=e.target.closest('[data-new]');if(b){close();setup(Number(b.dataset.new)||((s&&s.n)||4))}let r=e.target.closest('[data-resume]');if(r){close();s=savedCandidate;savedCandidate=null;chosen=s.pending||null;render();if(s.over)setTimeout(result,200);else if(s.turn!==0)timer=setTimeout(botMove,450)}});
$('azul-back').onclick=()=>parent.postMessage({type:'azul:back'},'*');clockInterval=setInterval(updateClock,1000);
document.addEventListener('click',e=>{const d=e.target.closest('[data-difficulty]');if(!d)return;aiDifficulty=Number(d.dataset.difficulty)||0;try{localStorage.setItem('mahbang-azul-difficulty',String(aiDifficulty))}catch(_){}close();toast('سختی رایانه ذخیره شد')});
$('settings').onclick=()=>modal(`<h2>تنظیمات بازی</h2><p>درجهٔ سختی رایانه</p><button class="cta" data-difficulty="0">آسان</button><button class="cta" data-difficulty="1">متوسط</button><button class="cta" data-difficulty="2">سخت</button><button class="cta secondary" data-close>بستن</button>`);
$('mode').onclick=()=>modal(`<h2>تعداد بازیکنان</h2><p>بازی در این نسخه با رایانه اجرا می‌شود. برای دیدن چیدمان چهار نفره، ۴ نفر را انتخاب کن.</p><button class="cta" data-new="2">۲ نفر</button><button class="cta" data-new="3">۳ نفر</button><button class="cta" data-new="4">۴ نفر</button><button class="cta secondary" data-close>بستن</button>`);
$('restart').onclick=()=>modal(`<h2>بازی تازه؟</h2><p>وضعیت فعلی ذخیره شده است؛ با شروع مجدد جایگزین می‌شود.</p><button class="cta" data-new="${s.n}">شروع مجدد</button><button class="cta secondary" data-close>بازگشت</button>`);
$('help').onclick=()=>modal(`<h2>راهنمای آزول مهبانگ</h2><p>از کارخانه یا مرکز، یک رنگ انتخاب کن. برای تغییر انتخاب کافی است روی رنگ دیگری بزنی؛ لازم نیست انصراف بدهی. رنگ انتخاب‌شده پررنگ می‌ماند و بقیه فقط ۲۰٪ کم‌رنگ می‌شوند.</p><p>کاشی‌های برداشته‌شده را می‌توانی در چند ردیف مجاز تقسیم کنی. اگر دیگر ردیفی جا نداشت، اضافه‌ها به کف جریمه می‌روند.</p><p>پنج ردیف سمت چپ برای آماده‌سازی‌اند و دیوار ۵×۵ سمت راست ساخته می‌شود. وقتی کارخانه‌ها خالی شدند، ردیف‌های کامل امتیاز می‌دهند.</p><p><strong>توجه:</strong> تقسیم یک برداشت بین چند ردیف قانون اختصاصی مهبانگ است و با آزول استاندارد تفاوت دارد.</p><button class="cta" data-close>متوجه شدم</button>`);
function result(){if(!s.over)return;let best=Math.max(...s.players.map(p=>p.score)),w=s.players.map((p,i)=>p.score===best?(i===0?'شما':'رایانه '+fa(i)):null).filter(Boolean);modal(`<h2>پایان بازی</h2><p>برنده: <b>${w.join(' و ')}</b></p>${s.players.map((p,i)=>`<p>${i===0?'شما':'رایانه '+fa(i)}: <b>${fa(p.score)}</b> امتیاز</p>`).join('')}<button class="cta" data-new="${s.n}">بازی مجدد</button>`)}
function startScreen(){modal(`<h2>آزول مهبانگ</h2><p>تعداد بازیکنان را انتخاب کن؛ یک نفر انسانی و بقیه رایانه‌ای بازی می‌کنند.</p><button class="cta" data-new="2">شروع بازی · ۲ نفر</button><button class="cta" data-new="3">شروع بازی · ۳ نفر</button><button class="cta" data-new="4">شروع بازی · ۴ نفر</button>${savedCandidate?'<button class="cta secondary" data-resume>ادامهٔ بازی ذخیره‌شده</button>':''}<button class="cta secondary" data-azul-back>بازگشت به هاب</button>`);}
window.addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin||!e.data||e.data.type!=='azul:set-avatars')return;const safe=v=>typeof v==='string'&&v.indexOf('data:image/')===0?v:null,profile=safe(e.data.profile),opponents=Array.isArray(e.data.opponents)?e.data.opponents.map(safe):[];const targets=s?s.players:(savedCandidate?savedCandidate.players:null);if(targets){targets.forEach((p,i)=>{const image=i===0?profile:opponents[i-1];if(image)p.avatar=image});if(s)render()}parent.postMessage({type:'azul:avatars-ready'},location.origin)});
if(load()){savedCandidate=s;s=null;if(params.get('resume')==='1')startScreen();else if(params.get('autostart')==='1')setup(Math.max(2,Math.min(4,Number(params.get('players')||2))));else startScreen()}else if(params.get('autostart')==='1'){setup(Math.max(2,Math.min(4,Number(params.get('players')||2))))}else{startScreen()}
})();
</script></body></html>
